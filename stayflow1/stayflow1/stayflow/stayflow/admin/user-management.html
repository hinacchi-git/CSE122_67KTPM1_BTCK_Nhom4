<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý tài khoản – StayFlow</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="admin-user-management">
  <main class="page">
    <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px">
      <div>
        <h1>Quản lý tài khoản &amp; phân quyền</h1>
        <p class="page-sub">Tạo tài khoản, cấp / đổi vai trò (Khách, Nhân viên, Quản lý, Quản trị viên) và vô hiệu hóa tài khoản. Mọi thay đổi đều được ghi vào nhật ký.</p>
      </div>
      <button class="btn btn-primary" id="addBtn">➕ Tạo tài khoản</button>
    </div>

    <div class="filters">
      <input type="search" id="qSearch" placeholder="🔍 Tìm theo tên đăng nhập, họ tên..." aria-label="Tìm tài khoản theo tên đăng nhập hoặc họ tên">
      <select id="roleFilter" aria-label="Lọc theo vai trò">
        <option value="">Tất cả vai trò</option>
        <option value="guest">Khách lưu trú</option>
        <option value="staff">Nhân viên</option>
        <option value="manager">Quản lý</option>
        <option value="admin">Quản trị viên</option>
      </select>
      <select id="sortBy" aria-label="Sắp xếp danh sách tài khoản">
        <option value="new">Mới tạo trước</option>
        <option value="old">Cũ nhất trước</option>
        <option value="name">Tên A → Z</option>
      </select>
    </div>

    <p class="result-count" id="resultCount" role="status" aria-live="polite"></p>

    <section id="app"></section>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/ai.js"></script>
  <script src="common.js"></script>
  <script src="user-management.js"></script>
</body>
</html>
