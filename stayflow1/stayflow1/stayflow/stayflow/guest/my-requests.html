<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yêu cầu của tôi – StayFlow</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="guest-my-requests">
  <main class="page">
    <div class="page-head">
      <h1>Yêu cầu của tôi</h1>
      <p class="page-sub">Theo dõi tiến độ từng yêu cầu và hủy nếu đổi ý (khi chưa bắt đầu xử lý).</p>
    </div>

    <div class="filters">
      <input type="search" id="qSearch" placeholder="🔍 Tìm theo tiêu đề, mô tả..." aria-label="Tìm yêu cầu theo tiêu đề hoặc mô tả">
      <select id="qStatus" aria-label="Lọc theo trạng thái">
        <option value="">Tất cả trạng thái</option>
        <option value="pending">Chờ tiếp nhận</option>
        <option value="confirmed">Đã điều phối</option>
        <option value="in-progress">Đang xử lý</option>
        <option value="completed">Hoàn thành</option>
        <option value="cancelled">Đã hủy</option>
      </select>
      <select id="qPriority" aria-label="Lọc theo mức ưu tiên">
        <option value="">Tất cả ưu tiên</option>
        <option value="urgent">Khẩn cấp</option>
        <option value="high">Cao</option>
        <option value="medium">Trung bình</option>
        <option value="low">Thấp</option>
      </select>
      <select id="qSort" aria-label="Sắp xếp danh sách yêu cầu">
        <option value="new">Mới nhất trước</option>
        <option value="old">Cũ nhất trước</option>
      </select>
    </div>
    <p class="result-count" id="resultCount" role="status" aria-live="polite"></p>
    <section id="list"></section>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/ai.js"></script>
  <script src="common.js"></script>
  <script src="my-requests.js"></script>
</body>
</html>
