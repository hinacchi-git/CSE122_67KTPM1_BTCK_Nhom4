<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo dịch vụ – StayFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="manager-service-report">
  <main class="page">
    <div class="page-head">
      <h1>Báo cáo dịch vụ</h1>
      <p class="page-sub">Tổng quan chất lượng phục vụ và đúc kết phản hồi khách bằng AI.</p>
    </div>

    <div class="grid-4" id="stats" style="margin-bottom:18px"></div>

    <div class="grid-2" style="align-items:start">
      <div class="card">
        <div class="card-title">📊 Yêu cầu theo loại dịch vụ</div>
        <div id="chart"></div>
      </div>
      <div class="card">
        <div class="card-title">💬 Tóm tắt phản hồi bằng AI (AI-3)</div>
        <p class="card-sub" style="margin-bottom:10px">AI đọc toàn bộ phản hồi, thống kê chủ đề nổi bật kèm ví dụ và lý do.</p>
        <button class="btn btn-accent btn-sm" id="aiSummaryBtn" type="button">✨ Tóm tắt phản hồi</button>
        <div id="aiPanel"></div>
      </div>
    </div>

    <h2 class="section-title">Phản hồi gần đây của khách</h2>
    <section id="fbList"></section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/manager.js"></script>
</body>
</html>
