<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yêu cầu của tôi – StayFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="guest-my-requests">
  <main class="page">
    <div class="page-head">
      <h1>Yêu cầu của tôi</h1>
      <p class="page-sub">Theo dõi tiến độ từng yêu cầu và hủy nếu đổi ý (khi chưa bắt đầu xử lý).</p>
    </div>

    <div class="filters">
      <input type="search" id="qSearch" placeholder="🔍 Tìm theo tiêu đề, mô tả...">
      <select id="qStatus">
        <option value="">Tất cả trạng thái</option>
        <option value="pending">Chờ tiếp nhận</option>
        <option value="confirmed">Đã điều phối</option>
        <option value="in-progress">Đang xử lý</option>
        <option value="completed">Hoàn thành</option>
        <option value="cancelled">Đã hủy</option>
      </select>
    </div>
    <section id="list"></section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/guest.js"></script>
</body>
</html>
