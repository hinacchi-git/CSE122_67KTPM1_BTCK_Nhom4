<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập nhật hệ thống – StayFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="admin-system-updates">
  <main class="page">
    <div class="page-head">
      <h1>Cập nhật hệ thống</h1>
      <p class="page-sub">Đăng bản tin / bản cập nhật (hiện trên dashboard) và bật/tắt chế độ bảo trì (banner toàn hệ thống).</p>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="switch-row" style="margin-bottom:6px">
        <button class="switch" id="maintBtn" aria-label="Chế độ bảo trì"></button>
        <b>Chế độ bảo trì hệ thống</b>
      </div>
      <p class="card-sub">Khi bật, banner "Hệ thống đang bảo trì" sẽ xuất hiện trên mọi trang.</p>
    </div>

    <div class="grid-2" style="align-items:start">
      <form class="card" id="updForm" novalidate>
        <div class="card-title">➕ Đăng bản tin / bản cập nhật</div>
        <label class="field">
          <span class="field-label">Tiêu đề <span class="req">*</span></span>
          <input type="text" id="uTitle" placeholder="Ví dụ: Cập nhật 1.2.0 – cải thiện theo dõi SLA">
          <small class="field-err" id="eTitle"></small>
        </label>
        <label class="field">
          <span class="field-label">Nội dung <span class="req">*</span></span>
          <textarea id="uContent" rows="3" placeholder="Mô tả ngắn gọn nội dung bản cập nhật..."></textarea>
          <small class="field-err" id="eContent"></small>
        </label>
        <label class="field">
          <span class="field-label">Loại</span>
          <select id="uType">
            <option value="update">🛠️ Bản cập nhật</option>
            <option value="announcement">📢 Bản tin</option>
          </select>
          <small class="field-err"></small>
        </label>
        <button class="btn btn-primary" type="submit">Đăng</button>
      </form>

      <section id="list"></section>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
